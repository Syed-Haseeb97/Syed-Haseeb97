<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Haseeb — engineer in progress</title>
  <desc id="desc">A custom black, violet and cyan plasma interface with a luminous energy core, orbiting rings and a technical grid.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#05050a"/><stop offset=".48" stop-color="#0b0716"/><stop offset="1" stop-color="#030b11"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#7c3aed" stop-opacity=".05"/><stop offset=".52" stop-color="#a78bfa" stop-opacity=".9"/><stop offset="1" stop-color="#22d3ee" stop-opacity=".15"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#a855f7"/><stop offset=".58" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <radialGradient id="core" cx=".31" cy=".25" r=".82"><stop stop-color="#f5eaff"/><stop offset=".16" stop-color="#d8b4fe"/><stop offset=".34" stop-color="#9333ea"/><stop offset=".62" stop-color="#5b21b6"/><stop offset=".83" stop-color="#17102e"/><stop offset="1" stop-color="#05050a"/></radialGradient>
    <radialGradient id="aura"><stop stop-color="#7c3aed" stop-opacity=".5"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="haze" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="28"/></filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#a78bfa" stroke-opacity=".075" stroke-width=".7"/></pattern>
  </defs>
  <rect width="1200" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="18" fill="url(#grid)"/>
  <g opacity=".36" fill="none" stroke-width="1">
    <path d="M0 75H280L305 100H420M0 82H270L298 110H390" stroke="#8b5cf6"/>
    <path d="M0 294H220L246 268H390M0 302H205L235 272H365" stroke="#22d3ee"/>
    <path d="M735 35H850L875 60H1040L1060 80H1200M800 325H930L950 305H1200" stroke="#8b5cf6"/>
    <circle cx="420" cy="100" r="2" fill="#c4b5fd"/><circle cx="390" cy="272" r="2" fill="#67e8f9"/><circle cx="1040" cy="60" r="2" fill="#67e8f9"/>
  </g>
  <ellipse cx="910" cy="176" rx="210" ry="175" fill="url(#aura)" filter="url(#haze)"><animate attributeName="opacity" values=".5;1;.5" dur="5s" repeatCount="indefinite"/></ellipse>
  <g transform="translate(910 176)">
    <circle r="112" fill="none" stroke="#a855f7" stroke-opacity=".12" stroke-width="1"/>
    <circle r="94" fill="none" stroke="#22d3ee" stroke-opacity=".18" stroke-dasharray="2 10"/>
    <ellipse rx="120" ry="43" fill="none" stroke="#a855f7" stroke-width="1.6" stroke-opacity=".85" filter="url(#glow)" transform="rotate(-28)"><animateTransform attributeName="transform" type="rotate" from="-28" to="332" dur="18s" repeatCount="indefinite"/></ellipse>
    <ellipse rx="105" ry="54" fill="none" stroke="#22d3ee" stroke-width="1.4" stroke-opacity=".85" transform="rotate(55)"><animateTransform attributeName="transform" type="rotate" from="55" to="-305" dur="14s" repeatCount="indefinite"/></ellipse>
    <ellipse rx="77" ry="28" fill="none" stroke="#e9d5ff" stroke-width=".8" stroke-opacity=".5" transform="rotate(82)"><animateTransform attributeName="transform" type="rotate" from="82" to="442" dur="22s" repeatCount="indefinite"/></ellipse>
    <circle r="70" fill="#7c3aed" opacity=".25" filter="url(#haze)"/>
    <circle r="56" fill="url(#core)" filter="url(#glow)"><animate attributeName="r" values="53;58;53" dur="4s" repeatCount="indefinite"/></circle>
    <path d="M-34 -12C-20 -45 19 -39 34 -13S16 13 10 32S-28 31 -34 -12Z" fill="none" stroke="#f5eaff" stroke-width="2.2" stroke-opacity=".85" filter="url(#glow)"><animate attributeName="d" dur="7s" repeatCount="indefinite" values="M-34 -12C-20 -45 19 -39 34 -13S16 13 10 32S-28 31 -34 -12Z;M-29 -24C-3 -43 37 -20 28 4S-2 40 -23 19S-40 -3 -29 -24Z;M-34 -12C-20 -45 19 -39 34 -13S16 13 10 32S-28 31 -34 -12Z"/></path>
    <circle cx="-84" cy="-57" r="3" fill="#67e8f9" filter="url(#glow)"><animate attributeName="opacity" values=".15;1;.15" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="96" cy="37" r="2.5" fill="#c4b5fd"><animate attributeName="opacity" values="1;.25;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="10" cy="-113" r="2" fill="#67e8f9"/>
