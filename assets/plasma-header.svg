<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Haseeb — building at the edge of AI and software</title>
  <desc id="desc">Animated purple and cyan plasma orb on a deep black futuristic background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05050a"/><stop offset=".55" stop-color="#0b0717"/><stop offset="1" stop-color="#02080d"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a855f7"/><stop offset=".52" stop-color="#7c3aed"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="orb" cx=".35" cy=".28" r=".78">
      <stop offset="0" stop-color="#e9d5ff"/><stop offset=".2" stop-color="#a855f7"/><stop offset=".56" stop-color="#6d28d9"/><stop offset=".8" stop-color="#17102f"/><stop offset="1" stop-color="#05050b"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#9b8acb" stroke-opacity=".08" stroke-width="1"/></pattern>
  </defs>
  <rect width="1200" height="330" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="330" rx="20" fill="url(#grid)"/>
  <ellipse cx="940" cy="164" rx="205" ry="120" fill="#7c3aed" opacity=".14" filter="url(#soft)"><animate attributeName="opacity" values=".08;.22;.08" dur="5s" repeatCount="indefinite"/></ellipse>
  <path d="M-20 260 C220 200 330 350 560 270 S900 130 1220 210" fill="none" stroke="url(#line)" stroke-opacity=".26" stroke-width="1.5"/>
  <path d="M-20 280 C220 220 330 370 560 290 S900 150 1220 230" fill="none" stroke="#22d3ee" stroke-opacity=".18" stroke-width="1"/>
  <g transform="translate(930 160)">
    <circle r="82" fill="#7c3aed" opacity=".16" filter="url(#soft)"/>
    <ellipse rx="80" ry="29" fill="none" stroke="#a855f7" stroke-opacity=".8" stroke-width="1.6" transform="rotate(-28)" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" from="-28" to="332" dur="18s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse rx="67" ry="35" fill="none" stroke="#22d3ee" stroke-opacity=".7" stroke-width="1.4" transform="rotate(56)">
      <animateTransform attributeName="transform" type="rotate" from="56" to="-304" dur="13s" repeatCount="indefinite"/>
    </ellipse>
    <circle r="52" fill="url(#orb)" filter="url(#glow)">
      <animate attributeName="r" values="49;54;49" dur="4s" repeatCount="indefinite"/>
    </circle>
    <path d="M-34 -10 C-13 -44 18 -31 31 -13 C43 6 15 14 8 31 C-5 45 -33 22 -34 -10Z" fill="none" stroke="#e9d5ff" stroke-opacity=".72" stroke-width="2.5">
      <animate attributeName="d" dur="7s" repeatCount="indefinite" values="M-34 -10 C-13 -44 18 -31 31 -13 C43 6 15 14 8 31 C-5 45 -33 22 -34 -10Z;M-30 -20 C-5 -40 32 -22 28 0 C26 18 -4 38 -21 21 C-38 8 -42 -1 -30 -20Z;M-34 -10 C-13 -44 18 -31 31 -13 C43 6 15 14 8 31 C-5 45 -33 22 -34 -10Z"/>
    </path>
    <circle cx="-68" cy="-48" r="2.5" fill="#67e8f9"><animate attributeName="opacity" values=".2;1;.2" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="72" cy="32" r="2" fill="#c4b5fd"><animate attributeName="opacity" values="1;.2;1" dur="3s" repeatCount="indefinite"/></circle>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="74" y="98" fill="#a78bfa" font-size="14" font-weight="700" letter-spacing="5">HELLO, WORLD — I'M</text>
    <text x="70" y="165" fill="#f8fafc" font-size="68" font-weight="800" letter-spacing="-2">HASEEB<tspan fill="#67e8f9">.</tspan></text>
    <text x="74" y="204" fill="#c4b5fd" font-size="21" font-weight="600">CSE @ IIIT Tiruchirappalli</text>
    <text x="74" y="240" fill="#cbd5e1" font-size="16">Building AI agents, developer tools &amp; practical software.</text>
    <rect x="74" y="267" width="8" height="8" rx="4" fill="#22d3ee" filter="url(#glow)"><animate attributeName="opacity" values="1;.3;1" dur="1.8s" repeatCount="indefinite"/></rect>
    <text x="94" y="276" fill="#94a3b8" font-size="12" letter-spacing="2.3">LEARN  /  BUILD  /  CONTRIBUTE  /  SHIP</text>
  </g>
  <rect x=".75" y=".75" width="1198.5" height="328.5" rx="19.25" fill="none" stroke="url(#line)" stroke-opacity=".45" stroke-width="1.5"/>
</svg>